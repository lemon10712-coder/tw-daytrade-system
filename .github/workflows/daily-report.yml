name: 每日台股當沖報告

on:
  schedule:
    # cron 是 UTC 時間。台北時間 08:15 = UTC 00:15。只在週一到週五跑（台股交易日，未扣除國定假日）。
    - cron: "15 0 * * 1-5"
  workflow_dispatch: {} # 允許手動在 GitHub 網頁上點「Run workflow」立即測試

permissions:
  contents: write # 需要 push 當天快照與報告回 repo

jobs:
  fetch-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy pytest markdown

      - name: Run unit tests（跑測試，測試沒過就不產生今天的報告）
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          pytest tests/ -q

      - name: 抓取真實資料並產生報告
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python scripts/fetch_and_report.py

      - name: 產生美化部落格網站（docs/，給 GitHub Pages 用）
        run: |
          python scripts/build_site.py

      - name: Commit 並 push 當天的快照、報告與網站
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ docs/
          if git diff --cached --quiet; then
            echo "沒有新的變更（可能今天已經跑過，或資料抓取失敗已提早中止），不建立空 commit"
          else
            git commit -m "chore: 自動產生 $(date -u +%Y-%m-%d) 台股當沖報告"
            git pull --rebase
            git push
          fi
